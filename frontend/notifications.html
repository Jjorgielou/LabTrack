<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | LabTrack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1e293b;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin: 0;
        }

        .navigation {
            display: flex;
            gap: 10px;
        }

        a, button {
            cursor: pointer;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 14px;
        }

        .nav-link {
            background: #e2e8f0;
            color: #1e293b;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .primary-button {
            background: #2563eb;
            color: white;
        }

        .danger-button {
            background: #dc2626;
            color: white;
        }

        .message {
            margin-top: 12px;
            font-size: 14px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
        }

        .empty-message {
            text-align: center;
            color: #64748b;
            padding: 25px;
        }

        @media (max-width: 650px) {
            body {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header class="header">
            <div>
                <h1>Notifications</h1>
                <p class="subtitle">
                    View and manage LabTrack notifications.
                </p>
            </div>

            <nav class="navigation">
                <a href="dashboard.html" class="nav-link">
                    Dashboard
                </a>

                <a href="conflicts.html" class="nav-link">
                    Conflict Reports
                </a>
            </nav>
        </header>

        <section class="card" id="createNotificationSection">
            <h2>Create Notification</h2>

            <form id="notificationForm">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="notificationUserId">Recipient User ID</label>
                        <input
                            type="number"
                            id="notificationUserId"
                            min="1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="notificationType">Notification Type</label>
                        <input
                            type="text"
                            id="notificationType"
                            placeholder="Example: Conflict Alert"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="notificationBookingId">
                            Booking ID (optional)
                        </label>
                        <input
                            type="number"
                            id="notificationBookingId"
                            min="1"
                        >
                    </div>

                    <div class="form-group full-width">
                        <label for="notificationMessage">Message</label>
                        <textarea
                            id="notificationMessage"
                            placeholder="Enter notification message..."
                            required
                        ></textarea>
                    </div>

                    <div class="form-group full-width">
                        <button
                            type="submit"
                            class="primary-button"
                            id="submitNotificationButton"
                        >
                            Send Notification
                        </button>
                    </div>

                </div>
            </form>

            <p id="notificationFormMessage" class="message"></p>
        </section>

        <section class="card">
            <h2>Notification Records</h2>

            <p id="notificationListMessage" class="message">
                Loading notifications...
            </p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Recipient</th>
                            <th>Message</th>
                            <th>Type</th>
                            <th>Booking ID</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="notificationsTableBody">
                        <tr>
                            <td colspan="7" class="empty-message">
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
