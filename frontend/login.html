
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LabTrack</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <main class="auth-container">
        <section class="auth-brand">
            <div class="brand-logo">LT</div>
            <h1>LabTrack</h1>
            <p>Computer Laboratory Equipment and Schedule Tracker</p>
        </section>

        <section class="auth-card">
            <h2>Welcome Back!</h2>
            <p class="auth-subtitle">Sign in to access your account.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <p id="loginMessage" class="form-message"></p>

                <button type="submit" class="btn-primary">
                    Sign In
                </button>
            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>
        </section>

        <footer class="auth-copyright">
            © 2026 LabTrack. All rights reserved.
        </footer>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
