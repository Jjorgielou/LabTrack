<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LabTrack</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <main class="auth-container">
        <section class="auth-brand">
            <div class="brand-logo">LT</div>
            <h1>LabTrack</h1>
            <p>Computer Laboratory Equipment and Schedule Tracker</p>
        </section>

        <section class="auth-card">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Register to access LabTrack.</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" required>
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" minlength="8" required>
                </div>

                <p id="registerMessage" class="form-message"></p>

                <button type="submit" class="btn-primary">
                    Create Account
                </button>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Sign In</a>
            </p>
        </section>

        <footer class="auth-copyright">
            © 2026 LabTrack. All rights reserved.
        </footer>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
